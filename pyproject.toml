[project]
name = "fastapi-ci-demo"
version = "0.1.0"
description = "Basic FastAPI project with pytest, Ruff, pre-commit, and GitHub Actions CI"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn",
    "httpx2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"